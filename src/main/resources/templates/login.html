<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Estacionamento</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #050505;
            color: white;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .login-area {
            width: 52%;
            min-height: 100vh;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            z-index: 2;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        h1 {
            font-size: 42px;
            font-weight: 400;
            margin-bottom: 46px;
            letter-spacing: -1px;
        }

        h1 span {
            color: #ff6a00;
            font-weight: bold;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #999;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border: none;
            border-radius: 9px;
            background: #191919;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 0 1px #ff6a00;
        }

        .esqueci {
            display: block;
            text-align: right;
            margin: 2px 0 22px;
            color: #999;
            font-size: 14px;
            text-decoration: none;
        }

        .esqueci:hover {
            color: #ff9d00;
        }

        button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(
                    90deg,
                    red 0%,
                    orangered 50%,
                    orange 100%
            );
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        .cadastro {
            margin-top: 24px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .cadastro a {
            color: #aaa;
            text-decoration: none;
        }

        .cadastro a:hover {
            color: #b347ff;
        }

        /* AREA DA IMAGEM / WALLPAPER */
        .imagem-area {
            width: 48%;
            min-height: 100vh;
            position: relative;
            background-image:
                    linear-gradient(
                            to right,
                            #050505 0%,
                            rgba(5, 5, 5, 0.4) 25%,
                            transparent 60%
                    ),
                    linear-gradient(
                            to top,
                            rgba(5, 5, 5, 0.6) 0%,
                            transparent 40%
                    ),
                    url('/ferrari.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        .imagem-area::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                    90deg,
                    #050505 0%,
                    rgba(5, 5, 5, 0.6) 12%,
                    transparent 35%
            );
            pointer-events: none;
        }

        @media (max-width: 800px) {
            .login-page {
                display: block;
                position: relative;
            }

            .imagem-area {
                position: absolute;
                inset: 0;
                width: 100%;
                opacity: 0.35;
            }

            .login-area {
                width: 100%;
                background: rgba(5, 5, 5, 0.85);
            }
        }
    </style>
</head>
<body>
<div class="login-page">
    <div class="login-area">
        <div class="login-container">
            <h1>Faça seu <span>login</span></h1>

            <form>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="">
                </div>

                <a href="templates/esqueci.html" class="esqueci">Esqueci minha senha</a>

               <button type="submit" href="painel.html">Entrar</button>

                <a href="estacionamento/cadastro.html">Ainda não tenho uma conta? Cadastre-se já!</a>
            </form>
        </div>
    </div>

    <div class="imagem-area"></div>
</div>
</body>
</html>
