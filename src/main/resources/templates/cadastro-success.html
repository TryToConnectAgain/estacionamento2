<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Painel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .painel-container {
            background-color: white;
            padding: 40px;
            width: 500px;

            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        h2 {
            color: #333;
            font-size: 28px;
        }
    </style>
</head>

<body>

<div class="painel-container">
    <h2>Cadastro Com Successo</h2>
</div>

</body>
</html>
