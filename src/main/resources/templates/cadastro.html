<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .cadastro-container {
            background-color: white;
            padding: 30px;
            width: 400px;

            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 5px;

            background-color: #007bff;
            color: white;

            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="cadastro-container">

    <h2>Cadastro</h2>

    <form method="post" action="/efetuar_cadastro">

        <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
        >

        <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="Digite seu CPF"
                required
        >

        <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu email"
                required
        >

        <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="Digite seu telefone"
                required
        >

        <input
                type="date"
                id="data_de_nascimento"
                name="data_de_nascimento"
                required
        >

        <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
        >

        <button type="submit">Cadastrar</button>

    </form>

</div>

</body>
</html>
